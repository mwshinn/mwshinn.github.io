- id: rca
  name: Reliability Component Analysis
  category: Representation learning
  description: Find maximally reliable dimensions using contrastive learning. Like PCA, but maximising test-retest reliability instead of explained variance.
  url: https://github.com/maxweissenbacher/scikit-rca
  paper: https://doi.org/10.64898/2026.01.25.701594
  image: /assets/img/software/rca-card.webp
  image_alt: Figure 2c schematic showing participant clusters along two uncorrelated reliable components, RC 1 and RC 2.
  image_style: illustration
  image_optimized: /assets/img/software/rca-card.webp
  image_optimized_width: 855
  image_optimized_height: 700
